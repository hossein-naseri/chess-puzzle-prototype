<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sightlines</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============================= SAGA MAP ============================= -->
<div class="view" id="view-saga">
  <header class="app-header">
    <div class="app-title">
      <h1>Sightlines</h1>
      <div class="app-sub">Chess &times; Sudoku</div>
    </div>
    <div class="app-header-tools">
      <span class="progress-chip" id="progressChip">0 / 33</span>
      <button type="button" class="icon-btn" id="soundBtn" aria-label="Toggle sound">&#9835;</button>
    </div>
  </header>
  <div class="saga-scroll" id="sagaScroll"></div>
</div>

<!-- ============================= GAME SCREEN ============================= -->
<div class="view" id="view-game" hidden>
  <header class="game-header">
    <button type="button" class="icon-btn" id="backBtn" aria-label="Back to map">&#8592;</button>
    <div class="game-header-mid">
      <div class="game-level-label" id="gameLevelLabel">—</div>
      <div class="game-level-sub" id="gameLevelSub">—</div>
    </div>
    <div class="game-timer" id="gameTimer">00:00</div>
  </header>

  <div class="game-body">
    <div class="board-panel">
      <div class="board-frame">
        <div class="coords-r" id="coordsR"></div>
        <div class="board-stack">
          <div class="board-grid" id="board"></div>
          <svg class="rays" id="rays" viewBox="0 0 600 600" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <div class="coords-f" id="coordsF"></div>
      </div>

      <div class="victory" id="victory" role="status" hidden>
        <span class="vg">&#9812;</span>
        <span class="vt" id="victoryTitle">Victory</span>
        <span class="vtime" id="vTime"></span>
      </div>
      <div class="victory-actions" id="victoryActions" hidden>
        <button type="button" class="btn" id="btnLevelSelect">Level select</button>
        <button type="button" class="btn key" id="btnNextLevel">Next level</button>
      </div>

      <div class="palette" id="palette"></div>
    </div>

    <div class="status-row">
      <div class="status" id="status">—</div>
      <div class="status-actions">
        <button type="button" class="btn" id="btnUndo">Undo</button>
        <button type="button" class="btn" id="btnReset">Reset</button>
        <button type="button" class="btn key" id="btnHint">Hint &#9658;</button>
      </div>
    </div>
  </div>

  <!-- tutorial coach-mark overlay, only used on the first level -->
  <div class="tutorial-overlay" id="tutorialOverlay" hidden>
    <div class="tutorial-card" id="tutorialCard"></div>
  </div>
</div>

<!-- skip-barrier confirmation -->
<div class="modal-overlay" id="skipOverlay" hidden>
  <div class="modal-card">
    <div class="modal-title" id="skipTitle">Skip ahead?</div>
    <div class="modal-body" id="skipBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn" id="skipNo">Stay here</button>
      <button type="button" class="btn key" id="skipYes">Skip ahead</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/rules.js"></script>
<script src="js/storage.js"></script>
<script src="js/analytics.js"></script>
<script src="js/ads.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/saga.js"></script>
<script src="js/main.js"></script>
</body>
</html>
