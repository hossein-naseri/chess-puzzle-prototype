name: Android build

# Builds the real, installable debug APK on GitHub's own runners, which
# have unrestricted network access to Google's Android SDK servers - unlike
# the sandbox this project was developed in, which blocks dl.google.com by
# policy. This is the path to a real build that doesn't require installing
# Android Studio locally: run it here, download the APK from the run's
# artifacts. See SAGA.md "Building the app for real".

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: android-actions/setup-android@v3

      - name: Install matching SDK platform + build-tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install JS deps
        run: npm ci

      - name: Build the native bridge (Capacitor plugin bundle)
        run: npm run build:native-bridge

      - name: Sync web assets + plugins into the native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chessdoku-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
